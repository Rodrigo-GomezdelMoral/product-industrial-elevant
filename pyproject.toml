[project]
name = "elevant"
version = "0.1.0"
description = "Lift inspection reports turned into reviewed, traceable repair quotes in Word"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "BLE", "SIM", "RUF", "FIX", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["opentelemetry.sdk._logs", "locust.event"]
files = ["."]
exclude = ["^\\.venv/", "^web/"]

[[tool.mypy.overrides]]
module = ["docxtpl", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
