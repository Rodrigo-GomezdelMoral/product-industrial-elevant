name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag already in the registry to redeploy to staging (rollback); empty builds this commit
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      RG: rg-elevant-stg-swc
      APP: ca-elevant-stg
      ACR: craiplatformshared
      IMAGE: product-industrial-elevant
      REQUESTED_TAG: ${{ inputs.tag }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      OPERATOR_PRINCIPAL_ID: ${{ secrets.OPERATOR_PRINCIPAL_ID }}
      ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      DOCINTEL_ENDPOINT: ${{ vars.DOCINTEL_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push one image per merge, tagged with the date, the branch and the commit
        if: inputs.tag == ''
        run: |
          tag="$(date -u +%Y%m%d)-main-${GITHUB_SHA::7}"
          az acr login -n "$ACR" --only-show-errors
          docker build --quiet -t "$ACR.azurecr.io/$IMAGE:$tag" .
          docker push --quiet "$ACR.azurecr.io/$IMAGE:$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Use the requested tag
        if: inputs.tag != ''
        run: echo "TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - name: Resolve the tag to its digest
        run: |
          digest="$(az acr repository show -n "$ACR" --image "$IMAGE:$TAG" --query digest -o tsv --only-show-errors)"
          test -n "$digest"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "REVISION_SUFFIX=r$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT-${TAG##*-}" >> "$GITHUB_ENV"
      - name: What-if, then deploy the digest to staging
        run: |
          az deployment group what-if -g "$RG" -p infra/main.staging.bicepparam --result-format ResourceIdOnly --only-show-errors
          az deployment group create -g "$RG" -n "elevant-$REVISION_SUFFIX" -p infra/main.staging.bicepparam -o none --only-show-errors
      - name: Smoke test, health and the digest staging serves
        run: |
          fqdn="$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "::add-mask::$fqdn"
          curl -fsS -o /dev/null --retry 12 --retry-delay 10 --retry-all-errors "https://$fqdn/healthz"
          for _ in $(seq 12); do
            served="$(curl -fsS "https://$fqdn/api/version" | jq -r .image || true)"
            [ "$served" = "$IMAGE_DIGEST" ] && break
            sleep 10
          done
          echo "staging serves $served"
          [ "$served" = "$IMAGE_DIGEST" ]
