name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install
      - name: Start Azurite and the Cosmos DB emulator
        run: make emulators
      - name: Lint, format, types, tests and budget
        run: make check
        env:
          ELEVANT_EMULATORS: "true"

  reference:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Released catalogues and templates are never changed in place
        run: |
          changed=$(git diff --name-only --diff-filter=DMR origin/main...HEAD -- data/reference)
          if [ -n "$changed" ]; then
            echo "::error::Add a new version instead of changing a released file: $changed"
            exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the API and start Azurite and the Cosmos DB emulator
        run: |
          python -m pip install -r requirements.txt
          make emulators
      - name: Build the demo mode, then type-check and build the web
        working-directory: web
        run: |
          npm ci
          VITE_DEMO=true npx vite build
          npm run build
      - name: Keyboard walk-through against the local API with axe, WCAG 2.2 AA
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  bicep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('infra/main.bicep') != ''
        name: Build and lint the templates
        run: |
          az bicep install --version v0.48.1
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The image builds, multi-stage and non-root
        run: |
          docker build --quiet -t elevant:ci .
          [ "$(docker image inspect elevant:ci --format '{{.Config.User}}')" = "10001" ]
