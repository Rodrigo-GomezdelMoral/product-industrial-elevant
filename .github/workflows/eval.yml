name: eval

on:
  pull_request:
    branches: [main]
    paths:
      - app/prompts/**
      - app/agents.py
      - app/workflow.py
      - app/domain.py
      - app/extraction.py
      - app/settings.py
      - data/reference/**
      - eval/**
      - .github/workflows/eval.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SHARED_GROUP: rg-aiplatform-shared-swc
  FOUNDRY: fdry-aiplatform-shared-swc
  PROJECT: proj-aiplatform-shared

jobs:
  pull-request:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PR }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve the shared Foundry endpoints
        run: |
          project=$(az cognitiveservices account project show -g "$SHARED_GROUP" -n "$FOUNDRY" --project-name "$PROJECT" \
            --query 'properties.endpoints."AI Foundry API"' -o tsv)
          docintel=$(az cognitiveservices account show -g "$SHARED_GROUP" -n "$FOUNDRY" --query properties.endpoint -o tsv)
          test -n "$project"
          test -n "$docintel"
          echo "::add-mask::$project"
          echo "::add-mask::$docintel"
          { echo "FOUNDRY_PROJECT_ENDPOINT=$project"; echo "DOCINTEL_ENDPOINT=$docintel"; } >> "$GITHUB_ENV"
      - name: Evaluate with the recorded extractions and the real matcher
        run: python -m eval.run | tee "$RUNNER_TEMP/eval.md" "$GITHUB_STEP_SUMMARY"
      - name: Comment the result on the pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Evaluation of ${HEAD::7} ([run]($RUN))"
            echo
            if [ -s "$RUNNER_TEMP/eval.md" ]; then cat "$RUNNER_TEMP/eval.md"; else echo "**The evaluation did not complete.**"; fi
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve the shared Foundry endpoints
        run: |
          project=$(az cognitiveservices account project show -g "$SHARED_GROUP" -n "$FOUNDRY" --project-name "$PROJECT" \
            --query 'properties.endpoints."AI Foundry API"' -o tsv)
          docintel=$(az cognitiveservices account show -g "$SHARED_GROUP" -n "$FOUNDRY" --query properties.endpoint -o tsv)
          test -n "$project"
          test -n "$docintel"
          echo "::add-mask::$project"
          echo "::add-mask::$docintel"
          { echo "FOUNDRY_PROJECT_ENDPOINT=$project"; echo "DOCINTEL_ENDPOINT=$docintel"; } >> "$GITHUB_ENV"
      - name: Evaluate with Document Intelligence and the real matcher
        run: python -m eval.run --full | tee "$GITHUB_STEP_SUMMARY"
